kind: Service
apiVersion: v1
metadata:
  name: mysql-headless
  namespace: expense
spec:
 clusterIP: None
 selector:
  project: expense
  component: mysql
  tier: db
 ports:
  - protocol: TCP
    port: 3306 #service port
    targetPort: 3306 # container port it is optional
---
kind: Service
apiVersion: v1
metadata:
  name: mysql
  namespace: expense
spec:
 selector:
  project: expense
  component: mysql
  tier: db
 ports:
  - protocol: TCP
    port: 80 #service port
    targetPort: 80 # container port it is optional

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: expense
spec:
  selector:
    matchLabels:
      project: expense
      component: mysql
      tier: db
  serviceName: "mysql-headless"  #this is the headless service should be mentioned
  replicas: 2 # by default is 1
  template:
    metadata:
      labels:
       project: expense
       component: mysql
       tier: db
    spec:
      containers:
      - name: mysql
        image: lakshman045/mysql:v1
        volumeMounts:
        - name: mysql
          mountPath: /var/lib/mysql
 # this is the pvc defination directly mention here         
  volumeClaimTemplates:
  - metadata:
      name: mysql
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "expense-ebs"
      resources:
        requests:
          storage: 1Gi